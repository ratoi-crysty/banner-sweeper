packages:
  - apps/*
  - libs/*
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  better-sqlite3: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.321'
  - '@anthropic-ai/claude-agent-sdk@0.3.321'
  - '@anthropic-ai/sdk@1.7.0'
